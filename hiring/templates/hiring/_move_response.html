{# The HTMX reply to a confirmed move: the refreshed workspace (swapped into #workspace), then out-of-band updates clearing the modal and showing the one message. #}
{% include "hiring/_workspace.html" %}
<div id="modal" hx-swap-oob="true"></div>
<div id="messages" hx-swap-oob="true"><div class="flex flex-col gap-2 mb-4"><div role="alert" class="alert alert-{{ message.level }}">{{ message.text }}</div></div></div>
